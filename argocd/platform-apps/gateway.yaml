apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/nicklasfrahm/charts/gateway-api
    targetRevision: 0.2.0
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: networking
  syncPolicy:
    automated:
      prune: false   
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true