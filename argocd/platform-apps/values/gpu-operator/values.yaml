operator:
  defaultRuntime: containerd
  tolerations:
    - key: "CriticalAddonsOnly"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"

driver:
  enabled: true

toolkit:
  enabled: true

devicePlugin:
  enabled: true
  # Time‑slicing configuration
  config:
    name: time-slicing-config
    default: default
    data:
      default: |
        version: v1
        sharing:
          timeSlicing:
            renameByDefault: false
            failRequestsGreaterThanOne: true
            resources:
            - name: nvidia.com/gpu
              replicas: 4 

dcgmExporter:
  enabled: true

serviceMonitor:
  enabled: true

migManager:
  enabled: false

nodeStatusExporter:
  enabled: true

# Global toleration for all GPU‑operator DaemonSets (driver, device plugin, etc.)
tolerations:
  - key: "nvidia.com/gpu"
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"
  - key: "CriticalAddonsOnly"      
    operator: "Equal"
    value: "true"
    effect: "NoSchedule"

# NFD (Node Feature Discovery) sub‑chart configuration
node-feature-discovery:
  enabled: true
  worker:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  master:
    enableTaints: true
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
  gc:
    tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "nvidia.com/gpu"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule" 