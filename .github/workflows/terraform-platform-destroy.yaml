name: Destroy Platform (ArgoCD, Karpenter, etc.)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (dev/prod)'
        required: true
        default: 'dev'
        type: choice
        options: ['dev', 'prod']

permissions:
  id-token: write
  contents: read

jobs:
  env:
    uses: ./.github/workflows/determine-environment.yaml

  # ----------------------------------------------------------------------
  # Pre‑destroy cleanup: remove finalizers and delete workload namespaces
  # ----------------------------------------------------------------------
  cleanup-cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: env
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform and AWS (infrastructure)
        uses: ./.github/actions/setup-terraform-oidc
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          working-directory: ./terraform/infrastructure
          tf-state-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-state-key: infra/${{ needs.env.outputs.environment }}/terraform.tfstate

      - name: Get cluster name
        id: get_cluster
        working-directory: ./terraform/infrastructure
        run: echo "cluster_name=$(terraform output -raw cluster_name)" >> $GITHUB_OUTPUT

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region ${{ vars.AWS_REGION }} --name ${{ steps.get_cluster.outputs.cluster_name }}

      - name: Remove finalizers from ArgoCD Applications
        run: |
          kubectl get applications -n argocd -o name 2>/dev/null | xargs -r -I {} kubectl patch {} -n argocd --type json -p='[{"op": "remove", "path": "/metadata/finalizers"}]' || true

      - name: Delete custom resources that may have finalizers
        run: |
          # Delete monitoring custom resources in target namespaces
          for ns in monitoring gpu-operator arc-systems training argo-rollouts; do
            kubectl delete servicemonitor --all -n $ns --ignore-not-found 2>/dev/null || true
            kubectl delete prometheusrule --all -n $ns --ignore-not-found 2>/dev/null || true
            kubectl delete application --all -n $ns --ignore-not-found 2>/dev/null || true
          done
          # Delete cluster-scoped Karpenter resources
          kubectl delete nodeclaim --all --ignore-not-found 2>/dev/null || true
          kubectl delete nodepool gpu-nodepool --ignore-not-found 2>/dev/null || true
          kubectl delete ec2nodeclass gpu-nodeclass --ignore-not-found 2>/dev/null || true

      - name: Soft delete workload namespaces
        run: |
          NAMESPACES="monitoring gpu-operator arc-systems training argo-rollouts"
          for ns in $NAMESPACES; do
            kubectl delete namespace $ns --ignore-not-found --wait=false || true
          done

      - name: Force delete stuck namespaces (API finalize)
        run: |
          NAMESPACES="monitoring gpu-operator arc-systems training argo-rollouts"
          for ns in $NAMESPACES; do
            if kubectl get namespace $ns &>/dev/null; then
              echo "Force removing finalizers from namespace $ns via /finalize"
              kubectl get namespace $ns -o json | jq '.spec.finalizers = []' | kubectl replace --raw "/api/v1/namespaces/$ns/finalize" -f - || true
              kubectl delete namespace $ns --force --grace-period=0 --wait=false || true
            fi
          done

  # ----------------------------------------------------------------------
  # Destroy manifests (platform resources)
  # ----------------------------------------------------------------------
  destroy-manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [env, cleanup-cluster]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform and AWS
        uses: ./.github/actions/setup-terraform-oidc
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          working-directory: ./terraform/platform/manifests
          tf-state-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-state-key: platform/${{ needs.env.outputs.environment }}/manifests/terraform.tfstate

      # Pre‑destroy: remove problematic CRDs that may have finalizers
      - name: Remove Karpenter CRDs (if present)
        run: |
          kubectl delete nodepool gpu-nodepool --ignore-not-found 2>/dev/null || true
          kubectl delete ec2nodeclass gpu-nodeclass --ignore-not-found 2>/dev/null || true

      - name: Terraform Destroy (manifests)
        working-directory: ./terraform/platform/manifests
        run: |
          terraform destroy -auto-approve -parallelism=50 \
            -var-file="envs/${{ needs.env.outputs.environment }}.tfvars" \
            -var="environment=${{ needs.env.outputs.environment }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="github_actions_role_arn=${{ vars.AWS_ROLE_ARN }}"

  # ----------------------------------------------------------------------
  # Destroy CRDs (Karpenter NodePool, EC2NodeClass, etc.)
  # ----------------------------------------------------------------------
  destroy-crds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [env, destroy-manifests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform and AWS
        uses: ./.github/actions/setup-terraform-oidc
        with:
          aws-role-arn: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          working-directory: ./terraform/platform/crds
          tf-state-bucket: ${{ vars.TF_STATE_BUCKET }}
          tf-state-key: platform/${{ needs.env.outputs.environment }}/crds/terraform.tfstate

      - name: Terraform Destroy (crds)
        working-directory: ./terraform/platform/crds
        run: |
          terraform destroy -auto-approve -parallelism=50 \
            -var-file="envs/${{ needs.env.outputs.environment }}.tfvars" \
            -var="environment=${{ needs.env.outputs.environment }}" \
            -var="tf_state_bucket=${{ vars.TF_STATE_BUCKET }}" \
            -var="aws_region=${{ vars.AWS_REGION }}" \
            -var="github_actions_role_arn=${{ vars.AWS_ROLE_ARN }}"